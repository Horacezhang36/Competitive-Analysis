name: Competitive Analysis CI/CD

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行（忽略新品检测）'
        required: false
        default: 'false'
        type: boolean

  # 定时触发 - 每天 8:00 UTC (北京时间 16:00)
  schedule:
    - cron: '0 8 * * *'

  # 代码推送触发
  push:
    branches:
      - main
      - develop
    paths:
      - 'agents/**'
      - 'skills/**'
      - '.github/workflows/**'
      - 'config.ini'

  # PR 触发
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==================== Lint/Scan ====================
  lint:
    name: Code Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flake8 black safety

      - name: Run Black (format check)
        run: |
          black --check --diff agents/ || echo "Format issues found"

      - name: Run Flake8 (lint)
        run: |
          flake8 agents/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Security scan
        run: |
          safety check || true

      - name: Check SKILL.md files
        run: |
          find agents -name "SKILL.md" | wc -l | xargs -I {} bash -c 'echo "Found {} SKILL.md files"'

  # ==================== Test ====================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run Generator Agent test
        run: |
          cd agents/generator
          python -c "from generator_agent import GeneratorAgent; print('Generator import OK')"

      - name: Run Verifier Agent test
        run: |
          cd agents/verifier
          python -c "from verifier_agent import VerifierAgent; print('Verifier import OK')"

      - name: Run Scheduler Agent test
        run: |
          cd agents/scheduler
          python -c "from scheduler_agent import SchedulerAgent; print('Scheduler import OK')"

      - name: Run Orchestrator Agent test
        run: |
          cd agents/orchestrator
          python -c "from orchestrator_agent import OrchestratorAgent; print('Orchestrator import OK')"

  # ==================== Generate Report ====================
  generate:
    name: Generate Analysis Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Generator Agent
        run: |
          cd agents/generator
          python generator_agent.py

      - name: Verify Report
        run: |
          cd agents/verifier
          python verifier_agent.py --report ../../reports/competitive_analysis_report.html

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: reports/competitive_analysis_report.html
          retention-days: 30

  # ==================== Deploy ====================
  deploy:
    name: Deploy to GitHub
    runs-on: ubuntu-latest
    needs: [lint, test, generate]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: analysis-report
          path: reports/

      - name: Create output subdirectory
        run: |
          mkdir -p output/2026
          cp reports/*.html output/2026/ 2>/dev/null || true
          mkdir -p output/latest
          cp reports/*.html output/latest/ 2>/dev/null || true

      - name: Update README with latest link
        run: |
          mkdir -p docs
          DATE=$(date +%Y-%m-%d)
          echo "## 最新报告" > docs/latest.md
          echo "- [竞品分析报告 ($DATE)](output/latest/competitive_analysis_report.html)" >> docs/latest.md

      - name: Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git commit -m "ci: Auto-publish report $(date +%Y-%m-%d)" || exit 0
          git push

      - name: Create Release Tag
        if: github.event_name == 'schedule'
        run: |
          TAG="v$(date +%Y%m%d)"
          git tag $TAG
          git push origin $TAG

  # ==================== Pages Deploy ====================
  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: analysis-report
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
