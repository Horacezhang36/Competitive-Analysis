# Competitive Analysis Demo - 竞品分析 Multi-Agent 系统
# 配置文件

[project]
name = Competitive-Analysis-Demo
version = 1.0.0
description = AI 竞品分析报告自动生成 Multi-Agent 系统

[agents]
# 各 Agent 配置
max_retries = 3
timeout_seconds = 300

[generator]
search_limit = 10
output_format = html
output_path = reports/competitive_analysis_report.html

[verifier]
passing_score = 75
url_validity_threshold = 0.8
check_facts = true
check_completeness = true
check_timeliness = true

[publisher]
repo_url = https://github.com/Horacezhang36/Competitive-Analysis
default_branch = main
auto_commit = true

[orchestrator]
workflow_state_file = logs/workflow_state.json
log_file = logs/orchestrator.log
enable_loop = true

[network]
# 联网搜索配置
use_matrix_mcp = true
search_timeout = 30